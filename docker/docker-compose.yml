version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../models:/app/models

  gradio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python src/serving/gradio_app.py
    ports:
      - "7860:7860"
    env_file:
      - ../.env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
